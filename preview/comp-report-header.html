<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
.report { background:#fff; border:1px solid var(--border); border-radius:8px; padding: 18px 22px; }
.h1 { font:600 24px/1.3 var(--font-sans); letter-spacing:-0.01em; color:var(--ink-900); display:flex; gap:10px; align-items:center; }
.eyebrow { font:600 11px/1 var(--font-sans); letter-spacing:.06em; text-transform:uppercase; color:var(--galicia-600); display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.meta { display:flex; gap:14px; margin-top:10px; font:400 12px var(--font-mono); color:var(--ink-500); }
.meta span { display:inline-flex; gap:6px; align-items:center; }
hr { border:0; border-top:1px solid var(--ink-100); margin: 14px 0 12px;}
.lead { font:400 14px/1.6 var(--font-sans); color:var(--ink-700); max-width:62ch; }
</style></head>
<body><div class="card">
  <div class="label" style="margin-bottom:12px;">Report — section header</div>
  <div class="report">
    <div class="eyebrow"><i data-lucide="stethoscope" style="width:12px;height:12px"></i>Query Doctor · Reporte</div>
    <div class="h1">Resumen ejecutivo</div>
    <div class="meta">
      <span><i data-lucide="database" style="width:13px;height:13px"></i>prod-redshift</span>
      <span><i data-lucide="folder" style="width:13px;height:13px"></i>crm</span>
      <span><i data-lucide="clock" style="width:13px;height:13px"></i>2026-05-23 14:32</span>
      <span><i data-lucide="hash" style="width:13px;height:13px"></i>5 hallazgos</span>
    </div>
    <hr/>
    <div class="lead">La query es funcionalmente válida, pero puede tener impacto de performance por scan amplio sobre <code>movimientos</code> y join previo al filtrado temporal.</div>
  </div>
  <script>lucide.createIcons();</script>
</div></body></html>
