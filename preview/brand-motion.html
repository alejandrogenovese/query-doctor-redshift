<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.row { display:grid; grid-template-columns: repeat(3, 1fr); gap:18px; }
.box { padding:14px; background:#fff; border:1px solid var(--border); border-radius:8px; }
.dur { font:500 22px var(--font-mono); color: var(--ink-900); letter-spacing:-0.02em; }
.tk { font:500 12px var(--font-mono); color: var(--ink-700); margin-top:4px; }
.use { font:400 12px/1.45 var(--font-sans); color: var(--ink-500); margin-top:6px; }
.curve { height:42px; margin-top:8px; }
</style></head>
<body><div class="card">
  <div class="label" style="margin-bottom:12px;">Motion — subordinate, not decorative</div>
  <div class="row">
    <div class="box">
      <div class="dur">120 ms</div><div class="tk">--duration-micro</div>
      <svg class="curve" viewBox="0 0 100 40"><path d="M0 38 C 20 38, 0 2, 100 2" fill="none" stroke="var(--galicia-500)" stroke-width="1.5"/></svg>
      <div class="use">Hover, focus, button states.</div>
    </div>
    <div class="box">
      <div class="dur">220 ms</div><div class="tk">--duration-panel</div>
      <svg class="curve" viewBox="0 0 100 40"><path d="M0 38 C 40 38, 60 2, 100 2" fill="none" stroke="var(--galicia-500)" stroke-width="1.5"/></svg>
      <div class="use">Panel slides, mode swap, accordion.</div>
    </div>
    <div class="box">
      <div class="dur">400 ms</div><div class="tk">--duration-modal</div>
      <svg class="curve" viewBox="0 0 100 40"><path d="M0 38 C 40 38, 60 2, 100 2" fill="none" stroke="var(--galicia-500)" stroke-width="1.5"/></svg>
      <div class="use">Toast / modal entry. Easing: <code>cubic-bezier(.4, 0, .2, 1)</code>.</div>
    </div>
  </div>
</div></body></html>
