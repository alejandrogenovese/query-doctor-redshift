<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
.grid { display:grid; grid-template-columns: repeat(8, 1fr); gap: 14px 18px; }
.ic { display:flex; flex-direction:column; align-items:center; gap:8px; }
.ic i { width:22px; height:22px; color: var(--ink-800); }
.nm { font:400 10.5px var(--font-mono); color: var(--ink-500); text-align:center; }
</style></head>
<body><div class="card">
  <div class="label" style="margin-bottom:12px;">Iconography — Lucide · 1.5 stroke</div>
  <div class="grid">
    <div class="ic"><i data-lucide="stethoscope"></i><span class="nm">stethoscope</span></div>
    <div class="ic"><i data-lucide="database"></i><span class="nm">database</span></div>
    <div class="ic"><i data-lucide="terminal"></i><span class="nm">terminal</span></div>
    <div class="ic"><i data-lucide="shield-check"></i><span class="nm">shield-check</span></div>
    <div class="ic"><i data-lucide="octagon-alert" style="color:var(--critical-700)"></i><span class="nm">octagon-alert</span></div>
    <div class="ic"><i data-lucide="alert-triangle" style="color:var(--warn-700)"></i><span class="nm">alert-triangle</span></div>
    <div class="ic"><i data-lucide="circle-check" style="color:var(--ok-700)"></i><span class="nm">circle-check</span></div>
    <div class="ic"><i data-lucide="info" style="color:var(--signal-700)"></i><span class="nm">info</span></div>
    <div class="ic"><i data-lucide="file-text"></i><span class="nm">file-text</span></div>
    <div class="ic"><i data-lucide="download"></i><span class="nm">download</span></div>
    <div class="ic"><i data-lucide="copy"></i><span class="nm">copy</span></div>
    <div class="ic"><i data-lucide="wand-sparkles"></i><span class="nm">wand-sparkles</span></div>
    <div class="ic"><i data-lucide="git-compare"></i><span class="nm">git-compare</span></div>
    <div class="ic"><i data-lucide="text-search"></i><span class="nm">text-search</span></div>
    <div class="ic"><i data-lucide="play"></i><span class="nm">play</span></div>
    <div class="ic"><i data-lucide="folder"></i><span class="nm">folder</span></div>
  </div>
  <script>lucide.createIcons();</script>
</div></body></html>
