<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.sw { display:flex; flex-direction:column; gap:6px; }
.chip { height:84px; border-radius:8px; border:1px solid var(--border); }
.row2 { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
.name { font:500 12px var(--font-mono); color:var(--ink-900); }
.val { font:400 11px var(--font-mono); color:var(--ink-500); }
.use { font:400 12px/1.5 var(--font-sans); color:var(--ink-600); margin-top:12px; max-width:60ch;}
</style></head>
<body><div class="card">
  <div class="label" style="margin-bottom:14px;">Granate — secondary · escudo</div>
  <div class="row2">
    <div class="sw"><div class="chip" style="background:var(--granate-100)"></div><span class="name">granate-100</span><span class="val">bg fill</span></div>
    <div class="sw"><div class="chip" style="background:var(--granate-300)"></div><span class="name">granate-300</span><span class="val">muted</span></div>
    <div class="sw"><div class="chip" style="background:var(--granate-500)"></div><span class="name" style="color:#fff">granate-500</span><span class="val">≈ #9B2424</span></div>
    <div class="sw"><div class="chip" style="background:var(--granate-700)"></div><span class="name" style="color:#fff">granate-700</span><span class="val">deep</span></div>
  </div>
  <div class="use">Uso restringido: la marca registrada (escudo / dagger lockup), encabezados ejecutivos, separadores en reportes formales. <b>No es color de acción</b> — para CTAs siempre usar <code>galicia</code>.</div>
</div></body></html>
