<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.row { display:grid; grid-template-columns: 60px 1fr 80px; gap:10px 16px; align-items:center; }
.bar { background: var(--galicia-300); height:14px; border-radius:2px; }
.tk { font:500 12px var(--font-mono); color:var(--ink-900); }
.px { font:400 12px var(--font-mono); color:var(--ink-500); text-align:right; }
</style></head>
<body><div class="card">
  <div class="label" style="margin-bottom:14px;">Spacing — 8pt grid</div>
  <div class="row">
    <span class="tk">--space-1</span><span class="bar" style="width:4px"></span><span class="px">4px</span>
    <span class="tk">--space-2</span><span class="bar" style="width:8px"></span><span class="px">8px</span>
    <span class="tk">--space-3</span><span class="bar" style="width:12px"></span><span class="px">12px</span>
    <span class="tk">--space-4</span><span class="bar" style="width:16px"></span><span class="px">16px</span>
    <span class="tk">--space-5</span><span class="bar" style="width:24px"></span><span class="px">24px</span>
    <span class="tk">--space-6</span><span class="bar" style="width:32px"></span><span class="px">32px</span>
    <span class="tk">--space-7</span><span class="bar" style="width:48px"></span><span class="px">48px</span>
    <span class="tk">--space-8</span><span class="bar" style="width:64px"></span><span class="px">64px</span>
    <span class="tk">--space-9</span><span class="bar" style="width:96px"></span><span class="px">96px</span>
  </div>
</div></body></html>
