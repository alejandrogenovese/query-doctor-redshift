<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.semantic { display:grid; grid-template-columns: 14px 1fr auto; gap:10px 14px; align-items:center; padding:14px; border:1px solid var(--border); border-radius:8px; }
.chip { width:14px; height:14px; border-radius:3px; border:1px solid color-mix(in oklch, currentColor, transparent 60%); }
.name { font:500 13px var(--font-mono); }
.val { font:400 11px var(--font-mono); color:var(--ink-500); }
</style></head>
<body><div class="card">
  <div class="label" style="margin-bottom:12px;">Semantic tokens — Clinic Light</div>
  <div class="semantic">
    <div class="chip" style="background:var(--bg)"></div><div class="name">--bg</div><div class="val">paper-50</div>
    <div class="chip" style="background:var(--bg-elevated)"></div><div class="name">--bg-elevated</div><div class="val">#fff</div>
    <div class="chip" style="background:var(--bg-sunken)"></div><div class="name">--bg-sunken</div><div class="val">ink-100</div>
    <div class="chip" style="background:var(--bg-code)"></div><div class="name">--bg-code</div><div class="val">ink-900</div>
    <div class="chip" style="background:var(--fg)"></div><div class="name">--fg</div><div class="val">ink-900</div>
    <div class="chip" style="background:var(--fg-muted)"></div><div class="name">--fg-muted</div><div class="val">ink-600</div>
    <div class="chip" style="background:var(--brand)"></div><div class="name">--brand</div><div class="val">galicia-500</div>
    <div class="chip" style="background:var(--border)"></div><div class="name">--border</div><div class="val">ink-200</div>
  </div>
</div></body></html>
