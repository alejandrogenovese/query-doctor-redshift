<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
.editor { background: var(--ink-900); border-radius: 8px; overflow: hidden; border: 1px solid var(--ink-700); }
.bar { display:flex; align-items:center; justify-content:space-between; padding: 8px 12px; background: var(--ink-950); border-bottom: 1px solid var(--ink-700); font:500 12px var(--font-mono); color: var(--ink-300);}
.body { display:grid; grid-template-columns: 36px 1fr; }
.gutter { padding: 14px 0; text-align:right; font:400 12px/1.7 var(--font-mono); color: var(--ink-500); user-select:none; border-right: 1px solid var(--ink-800); }
.gutter span { display:block; padding-right: 10px; }
.code { padding: 14px 14px 14px 14px; font:400 13px/1.7 var(--font-mono); letter-spacing:-0.005em; color: var(--paper-50); white-space:pre; }
.k{color:var(--sql-keyword);} .fn{color:var(--sql-function);} .tbl{color:var(--sql-table);} .num{color:var(--sql-number);} .s{color:var(--sql-string);} .c{color:var(--sql-comment); font-style:italic;}
</style></head>
<body><div class="card">
  <div class="label" style="margin-bottom:12px;">SQL editor</div>
  <div class="editor">
    <div class="bar">
      <span style="display:inline-flex;gap:8px;align-items:center;"><i data-lucide="file-code-2" style="width:14px;height:14px"></i>query.sql</span>
      <span style="display:inline-flex;gap:14px;align-items:center;"><span><i data-lucide="shield-check" style="width:13px;height:13px;vertical-align:-2px"></i> read-only</span><span>Plex Mono · 13px</span></span>
    </div>
    <div class="body">
      <div class="gutter"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
<pre class="code"><span class="c">-- top clientes 2026</span>
<span class="k">SELECT</span> c.nombre, <span class="fn">SUM</span>(m.monto) <span class="k">AS</span> total
<span class="k">FROM</span>   <span class="tbl">crm.clientes</span> c
<span class="k">JOIN</span>   <span class="tbl">finanzas.movimientos</span> m <span class="k">ON</span> c.party_id = m.party_id
<span class="k">WHERE</span>  m.fecha &gt;= <span class="s">'2026-01-01'</span>;</pre>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</div></body></html>
