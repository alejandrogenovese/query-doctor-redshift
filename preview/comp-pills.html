<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
.pill { display:inline-flex; align-items:center; gap:6px; padding: 4px 10px 4px 8px; border-radius: 999px; font:600 11px/1 var(--font-sans); letter-spacing:.04em; text-transform:uppercase; }
.p-crit { background: var(--critical-100); color: var(--critical-700); }
.p-warn { background: var(--warn-100);     color: var(--warn-700); }
.p-ok   { background: var(--ok-100);       color: var(--ok-700); }
.p-info { background: var(--signal-100);   color: var(--signal-700); }
.p-neu  { background: var(--ink-100);      color: var(--ink-700); }
.tag { display:inline-flex; align-items:center; gap:6px; padding: 4px 10px; border-radius: var(--radius-sm); font:500 12px var(--font-mono); background: var(--ink-100); color: var(--ink-700); border: 1px solid var(--ink-200); }
</style></head>
<body><div class="card">
  <div class="label" style="margin-bottom:12px;">Pills & tags</div>
  <div class="row" style="margin-bottom:14px;">
    <span class="pill p-crit"><i data-lucide="octagon-alert" style="width:12px;height:12px"></i>Crítico</span>
    <span class="pill p-warn"><i data-lucide="alert-triangle" style="width:12px;height:12px"></i>Atención</span>
    <span class="pill p-ok"><i data-lucide="circle-check" style="width:12px;height:12px"></i>OK</span>
    <span class="pill p-info"><i data-lucide="info" style="width:12px;height:12px"></i>Info</span>
    <span class="pill p-neu">Read-only</span>
  </div>
  <div class="row">
    <span class="tag"><i data-lucide="database" style="width:12px;height:12px"></i>cluster: prod-redshift</span>
    <span class="tag"><i data-lucide="folder" style="width:12px;height:12px"></i>schema: crm</span>
    <span class="tag">LIMIT 100</span>
    <span class="tag" style="border-color:var(--warn-100); color:var(--warn-700); background:var(--warn-50)"><i data-lucide="shield-alert" style="width:12px;height:12px"></i>PII detectada</span>
  </div>
  <script>lucide.createIcons();</script>
</div></body></html>
