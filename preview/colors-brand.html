<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.sw { display:flex; flex-direction:column; gap:6px; }
.chip { height:84px; border-radius:8px; border:1px solid var(--border); }
.row2 { display:grid; grid-template-columns: repeat(5, 1fr); gap:14px; }
.name { font:500 12px var(--font-mono); color:var(--ink-900); }
.val { font:400 11px var(--font-mono); color:var(--ink-500); }
</style></head>
<body><div class="card">
  <div class="label" style="margin-bottom:14px;">Galicia — naranja vivo · primary</div>
  <div class="row2">
    <div class="sw"><div class="chip" style="background:var(--galicia-50)"></div><span class="name">galicia-50</span><span class="val">tint</span></div>
    <div class="sw"><div class="chip" style="background:var(--galicia-100)"></div><span class="name">galicia-100</span><span class="val">bg fill</span></div>
    <div class="sw"><div class="chip" style="background:var(--galicia-300)"></div><span class="name">galicia-300</span><span class="val">muted</span></div>
    <div class="sw"><div class="chip" style="background:var(--galicia-500)"></div><span class="name" style="color:#fff">galicia-500</span><span class="val">brand · ≈ #FF6A00</span></div>
    <div class="sw"><div class="chip" style="background:var(--galicia-700)"></div><span class="name" style="color:#fff">galicia-700</span><span class="val">press</span></div>
  </div>
</div></body></html>
