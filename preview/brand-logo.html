<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
.lockup { display:inline-flex; gap:10px; align-items:center; font:600 22px var(--font-sans); letter-spacing:-0.012em; color: var(--ink-900); }
.lockup i { color: var(--galicia-500); }
.row { display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
.dark { background: var(--ink-950); padding: 16px 22px; border-radius: 8px; }
.dark .lockup { color: var(--paper-50); }
.dark .lockup i { color: var(--galicia-500); }
.mark { background:#fff; border:1px solid var(--border); padding:14px; border-radius:8px; display:inline-flex; }
.mark i { color: var(--galicia-500); }
</style></head>
<body><div class="card">
  <div class="label" style="margin-bottom:14px;">Logo — lockup + mark</div>
  <div class="row">
    <span class="lockup"><i data-lucide="stethoscope" style="width:28px;height:28px;stroke-width:1.85"></i>Query Doctor</span>
    <span class="dark"><span class="lockup"><i data-lucide="stethoscope" style="width:28px;height:28px;stroke-width:1.85"></i>Query Doctor</span></span>
    <span class="mark"><i data-lucide="stethoscope" style="width:28px;height:28px;stroke-width:1.85"></i></span>
  </div>
  <div class="kv" style="margin-top:16px;"><b>Glyph</b><span>·</span><span>Lucide stethoscope · stroke 1.85 · galicia-500</span><span>·</span><b>Type</b><span>·</span><span>Plex Sans 600 · -0.012em</span></div>
  <script>lucide.createIcons();</script>
</div></body></html>
