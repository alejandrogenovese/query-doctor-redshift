<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.row { display:flex; gap:24px; align-items:flex-end; }
.r { display:flex; flex-direction:column; align-items:center; gap:8px; }
.box { width:90px; height:90px; background: var(--paper-100); border:1px solid var(--ink-300); }
.tk { font:500 12px var(--font-mono); color:var(--ink-900); }
.px { font:400 11px var(--font-mono); color:var(--ink-500); }
</style></head>
<body><div class="card">
  <div class="label" style="margin-bottom:14px;">Radius — sober, technical</div>
  <div class="row">
    <div class="r"><div class="box" style="border-radius:0"></div><span class="tk">none</span><span class="px">0</span></div>
    <div class="r"><div class="box" style="border-radius:4px"></div><span class="tk">--radius-sm</span><span class="px">4px · controls</span></div>
    <div class="r"><div class="box" style="border-radius:8px"></div><span class="tk">--radius-md</span><span class="px">8px · panels</span></div>
    <div class="r"><div class="box" style="border-radius:12px"></div><span class="tk">--radius-lg</span><span class="px">12px · modals</span></div>
    <div class="r"><div class="box" style="border-radius:999px"></div><span class="tk">--radius-pill</span><span class="px">badges · pills</span></div>
  </div>
</div></body></html>
