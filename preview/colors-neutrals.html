<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.scale { display:grid; grid-template-columns: repeat(12, 1fr); gap:0; border-radius:6px; overflow:hidden; border:1px solid var(--border); }
.cell { aspect-ratio: 1/1.4; display:flex; align-items:flex-end; justify-content:flex-start; padding:6px; font:500 10px var(--font-mono); }
</style></head>
<body><div class="card">
  <div class="label" style="margin-bottom:14px;">Neutrals — cool-tinted ink/paper</div>
  <div class="scale">
    <div class="cell" style="background:var(--paper-50); color:var(--ink-700)">50</div>
    <div class="cell" style="background:var(--paper-100); color:var(--ink-700)">100</div>
    <div class="cell" style="background:var(--ink-100); color:var(--ink-700)">ink-100</div>
    <div class="cell" style="background:var(--ink-200); color:var(--ink-700)">200</div>
    <div class="cell" style="background:var(--ink-300); color:var(--ink-800)">300</div>
    <div class="cell" style="background:var(--ink-400); color:var(--paper-50)">400</div>
    <div class="cell" style="background:var(--ink-500); color:var(--paper-50)">500</div>
    <div class="cell" style="background:var(--ink-600); color:var(--paper-50)">600</div>
    <div class="cell" style="background:var(--ink-700); color:var(--paper-50)">700</div>
    <div class="cell" style="background:var(--ink-800); color:var(--paper-50)">800</div>
    <div class="cell" style="background:var(--ink-900); color:var(--paper-50)">900</div>
    <div class="cell" style="background:var(--ink-950); color:var(--paper-50)">950</div>
  </div>
  <div class="kv" style="margin-top:12px;"><b>paper</b>·surfaces ﹒ <b>ink</b>·text & dark surfaces ﹒ tint <code style="font-size:11px;">h=200</code></div>
</div></body></html>
